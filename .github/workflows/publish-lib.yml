# Build and publish pybrilliantkiosk to PyPI from a tag, with PyPI trusted publishing (OIDC):
# no API token is stored in the repository. Tag format: pybrilliantkiosk-vX.Y.Z (must match
# lib/pybrilliantkiosk/pyproject.toml). One-time setup on PyPI: project pybrilliantkiosk →
# Publishing → add a GitHub publisher: owner MikeI-Code, repo brilliant-ha-kiosk,
# workflow publish-lib.yml, environment pypi.
name: Publish pybrilliantkiosk

on:
  push:
    tags: ["pybrilliantkiosk-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#pybrilliantkiosk-v}"
          version="$(grep -m1 '^version = ' lib/pybrilliantkiosk/pyproject.toml | cut -d'"' -f2)"
          test "$tag" = "$version" || { echo "tag $tag != pyproject version $version"; exit 1; }
      # The same checks as the Integration workflow, with the same pins as requirements_test.txt:
      # nothing is built or published from a tag that would not pass them.
      - name: Ruff
        working-directory: lib/pybrilliantkiosk
        run: uvx ruff@0.17.4 check .
      - name: Ruff format
        working-directory: lib/pybrilliantkiosk
        run: uvx ruff@0.17.4 format --check .
      - name: Mypy --strict
        working-directory: lib/pybrilliantkiosk
        run: uv run --python 3.14 --with-editable '.[dev]' --with mypy==2.4.1 mypy --strict src
      - name: Test
        working-directory: lib/pybrilliantkiosk
        run: uv run --python 3.14 --with-editable '.[dev]' pytest -q
      - name: Build
        working-directory: lib/pybrilliantkiosk
        run: uv build && uvx twine@7.0.0 check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: lib/pybrilliantkiosk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
