# CI for the Home Assistant integration (custom_components/brilliant_kiosk) and its library
# (lib/pybrilliantkiosk): ruff (lint and format), mypy --strict, both pytest suites at 100 %
# coverage, hassfest and HACS validation.
#
# Versions: the integration job installs requirements_test.txt, which pins
# pytest-homeassistant-custom-component to the exact release for Home Assistant 2026.3.1. That is
# also the minimum in hacs.json (2026.3 is the first release with local brand images), and it needs
# Python 3.14. Raise all of them together.
#
# Strict typing: Home Assistant core registers strict modules in its own `.strict-typing` file,
# which does not exist for custom integrations. The equivalent here is `mypy --strict` over the
# whole integration and library (see [tool.mypy] in pyproject.toml), enforced by the jobs below.
name: Integration
on:
  push:
    branches: [main, nightly]
    paths:
      - "custom_components/**"
      - "lib/pybrilliantkiosk/**"
      - "tests/**"
      - "kiosk/**"
      - "config/kiosk.env.example"
      - "native/**"
      - "pyproject.toml"
      - "requirements_test.txt"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "lib/pybrilliantkiosk/**"
      - "tests/**"
      - "kiosk/**"
      - "config/kiosk.env.example"
      - "native/**"
      - "pyproject.toml"
      - "requirements_test.txt"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "17 5 * * 1"        # weekly: new Home Assistant releases can break the integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  present:
    name: Integration code present
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workflow lives on main (repo rule), but the integration is developed on nightly;
      # skip every job on a branch that doesn't contain it yet instead of failing.
      - id: check
        run: echo "found=$([ -f custom_components/brilliant_kiosk/manifest.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  library:
    needs: present
    if: needs.present.outputs.found == 'true'
    name: Library (pybrilliantkiosk, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lib/pybrilliantkiosk/pyproject.toml
      # ruff and mypy: the same pins as requirements_test.txt, so both jobs format alike.
      - run: pip install -e "lib/pybrilliantkiosk[dev]" ruff==0.17.4 mypy==2.4.1
      - name: Ruff
        run: ruff check lib/pybrilliantkiosk
      - name: Ruff format
        run: ruff format --check lib/pybrilliantkiosk
      - name: Mypy --strict
        working-directory: lib/pybrilliantkiosk
        run: mypy --strict src
      - name: Tests (coverage gate in pyproject.toml, 100 %)
        working-directory: lib/pybrilliantkiosk
        run: python -m pytest -q -p no:homeassistant

  integration:
    needs: present
    if: needs.present.outputs.found == 'true'
    name: Integration (Home Assistant tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            lib/pybrilliantkiosk/pyproject.toml
      - run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check custom_components tests lib/pybrilliantkiosk
      - name: Ruff format
        run: ruff format --check custom_components tests lib/pybrilliantkiosk
      - name: Mypy --strict
        run: mypy --strict custom_components/brilliant_kiosk
      - name: Tests (coverage gate in pyproject.toml, 100 %)
        run: python -m pytest tests -q

  hassfest:
    needs: present
    if: needs.present.outputs.found == 'true'
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master on 2026-11-09 (the repo has no release for it)

  hacs:
    needs: present
    if: needs.present.outputs.found == 'true'
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main on 2026-11-09 (newer than the 22.5.0 tag)
        with:
          category: integration
          # The brand images are the integration's own custom_components/brilliant_kiosk/brand/
          # folder, which Home Assistant itself serves since 2026.3 (hacs.json). The action's
          # brands check only looks in the home-assistant/brands repository (its docs do not
          # mention a local folder), so it would fail a correct setup.
          ignore: brands
