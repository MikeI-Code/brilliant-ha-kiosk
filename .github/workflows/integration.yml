# CI for the Home Assistant integration (custom_components/brilliant_kiosk) and its library
# (lib/pybrilliantkiosk): ruff, mypy --strict, both pytest suites, hassfest and HACS validation.
#
# Strict typing: Home Assistant core registers strict modules in its own `.strict-typing` file,
# which does not exist for custom integrations. The equivalent here is `mypy --strict` over the
# whole integration and library (see [tool.mypy] in pyproject.toml), enforced by the jobs below.
name: Integration
on:
  push:
    branches: [main, nightly]
    paths:
      - "custom_components/**"
      - "lib/pybrilliantkiosk/**"
      - "tests/**"
      - "pyproject.toml"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "lib/pybrilliantkiosk/**"
      - "tests/**"
      - "pyproject.toml"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "17 5 * * 1"        # weekly: new Home Assistant releases can break the integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library:
    name: Library (pybrilliantkiosk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lib/pybrilliantkiosk/pyproject.toml
      - run: pip install -e "lib/pybrilliantkiosk[dev]"
      - name: Ruff
        run: ruff check lib/pybrilliantkiosk
      - name: Mypy --strict
        working-directory: lib/pybrilliantkiosk
        run: mypy --strict src
      - name: Tests (coverage gate in pyproject.toml, 95 %)
        working-directory: lib/pybrilliantkiosk
        run: python -m pytest -q -p no:homeassistant

  integration:
    name: Integration (Home Assistant tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install pytest-homeassistant-custom-component ruff mypy
          pip install -e lib/pybrilliantkiosk
      - name: Ruff
        run: ruff check custom_components tests lib/pybrilliantkiosk
      - name: Mypy --strict
        run: mypy --strict custom_components/brilliant_kiosk
      - name: Tests (coverage gate in pyproject.toml, 95 %)
        run: python -m pytest tests -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
