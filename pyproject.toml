# Test and lint tooling for custom_components/brilliant_kiosk (the library has its own pyproject).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.brilliant_kiosk --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.mypy]
strict = true
python_version = "3.13"
files = ["custom_components/brilliant_kiosk"]
plugins = []

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
