# Installed as /etc/systemd/system/message_bus.service.d/ha-kiosk-display.conf
# Brilliant's hardware peripheral still runs its own screen-off logic (motion/idle): it writes the
# backlight and blanks fb0. Without switch-ui that fights ha-kiosk-display.sh and leaves the screen
# black after a touch. So the Brilliant services get private dummy copies of those files (created by
# /etc/tmpfiles.d/ha-kiosk.conf); the real ones are left to ha-kiosk-display.sh.
# The leading "-" skips a bind if its dummy is missing, so this can never stop message_bus starting.
[Service]
BindPaths=-/run/ha-kiosk-shadow/brightness:/sys/devices/platform/backlight_lcd/backlight/backlight_lcd/brightness
BindPaths=-/run/ha-kiosk-shadow/bl_power:/sys/devices/platform/backlight_lcd/backlight/backlight_lcd/bl_power
BindPaths=-/run/ha-kiosk-shadow/blank:/sys/devices/platform/fb@0/graphics/fb0/blank
