# Installed as /etc/tmpfiles.d/ha-kiosk.conf: dummy display files for the Brilliant services
# (see message_bus-ha-kiosk.conf). Created at boot, before message_bus starts.
d /run/ha-kiosk-shadow 0755 root root -
f /run/ha-kiosk-shadow/brightness 0666 root root - 15
f /run/ha-kiosk-shadow/bl_power 0666 root root - 0
f /run/ha-kiosk-shadow/blank 0666 root root - 0
