[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybrilliantkiosk"
version = "0.1.3"
description = "Async client for managing Brilliant smart-panel kiosks (ha-kiosk) over SSH"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Mike Ippolito" }]
keywords = ["brilliant", "home-assistant", "kiosk", "ssh", "asyncio"]
dependencies = ["asyncssh>=2.17", "aiohttp>=3.10"]
classifiers = [
  "Framework :: AsyncIO",
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MikeI-Code/brilliant-ha-kiosk"
Source = "https://github.com/MikeI-Code/brilliant-ha-kiosk/tree/main/lib/pybrilliantkiosk"
Issues = "https://github.com/MikeI-Code/brilliant-ha-kiosk/issues"
Documentation = "https://github.com/MikeI-Code/brilliant-ha-kiosk/blob/main/lib/pybrilliantkiosk/README.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/pybrilliantkiosk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=pybrilliantkiosk --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
